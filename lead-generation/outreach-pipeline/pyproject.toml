[project]
name = "outreach"
version = "0.1.0"
description = "Coach outreach pipeline: fetch, filter, generate, grid, review, draft"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pillow>=10.4",
    "opencv-python>=4.10",
    "insightface>=0.7.3",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
outreach = "outreach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outreach"]
